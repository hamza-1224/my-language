# Records Persian audio (iPhones and Macs have no Persian voice) for every word, example and
# reading text, using Microsoft's Iranian neural voice through edge-tts. Only new texts are recorded.
name: Persian audio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/persian.js", "data/fagrammar.js", "data/favocab.js", "data/reading.js", "scripts/make_audio.py", "scripts/audio_texts.js", ".github/workflows/audio.yml"]

permissions:
  contents: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record new Persian audio
        run: |
          pip install -q edge-tts
          node scripts/audio_texts.js | python3 scripts/make_audio.py audio/fa
      - name: Commit the recordings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -qm "Persian audio for new words and texts"
          git pull -q --rebase origin main
          git push -q
