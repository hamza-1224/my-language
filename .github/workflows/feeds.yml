# Picks this week's B1–C2 articles for the Read tab, every Monday morning.
# Writes fr.json and fa.json to the `feeds` branch as a single commit (replaced each time,
# so the main branch's history stays clean). The app reads them from raw.githubusercontent.com.
name: Weekly reading list

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"
  push:
    branches: [main]
    paths: ["scripts/fetch_feeds.py", ".github/workflows/feeds.yml"]

permissions:
  contents: write

concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the feeds
        run: python3 scripts/fetch_feeds.py out

      - name: Publish to the feeds branch
        run: |
          cd out
          git init -q -b feeds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fr.json fa.json
          git commit -qm "News feeds $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" feeds
